<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050"><style>text{fill:#242421;font-family:Arial,sans-serif}.serif{font-family:Georgia,serif}.small{font-size:11px;letter-spacing:1.5px;fill:#686359}.orbit{fill:none;stroke:#d9d4c9;stroke-width:.7;stroke-dasharray:2 7}.inner{stroke-dasharray:none}.line{fill:none;stroke:#85735e;stroke-width:.6}.pulse{fill:none;stroke:#85735e;stroke-width:.5}.core{fill:#242421}.satellite circle:first-child{fill:#f5f2eb;stroke:#85735e;stroke-width:1}.satellite circle:last-child{fill:none;stroke:#d9d4c9;stroke-width:.5}</style><rect width="1440" height="1050" fill="#f5f2eb"/><text x="88" y="62" class="serif" font-size="28">Founders &amp; Builders</text><text x="1045" y="60" font-size="12">The network</text><text x="1160" y="60" font-size="12">How it works</text><text x="1290" y="60" font-size="12">Explore ↗</text><path d="M86 100H1354" stroke="#d9d4c9"/><circle cx="92" cy="203" r="3" fill="#85735e"/><text x="108" y="207" class="small">PEOPLE. IDEAS. SHARED AMBITION.</text><text x="86" y="340" class="serif" font-size="110" letter-spacing="-6">Good work finds</text><text x="86" y="453" class="serif" font-size="110" letter-spacing="-6">its <tspan fill="#85735e" font-style="italic">people.</tspan></text><text x="88" y="520" font-size="18">A living network for people with ideas</text><text x="88" y="551" font-size="18">and people who bring them to life.</text><rect x="88" y="590" width="278" height="54" fill="#242421"/><text x="111" y="623" font-size="13" style="fill:#f5f2eb">Find your first connection</text><text x="335" y="623" font-size="17" style="fill:#f5f2eb">↗</text><text x="88" y="677" font-size="11" style="fill:#686359">Start with a contribution. Build something together.</text><svg x="760" y="155" width="560" height="560" viewBox="0 0 560 560"><defs><radialGradient id="halo"><stop stop-color="#d9d4c9" stop-opacity=".4"/><stop offset="1" stop-color="#f5f2eb" stop-opacity="0"/></radialGradient></defs